<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Reacture Portfolio</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #0D1117;
            color: #f0f6fc;
            min-height: 100vh;
        }

        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0D1117;
            gap: 16px;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash-title {
            font-family: monospace;
            font-size: 22px;
            color: #67e8f9;
            letter-spacing: 0.08em;
        }

        #splash-sub {
            font-family: monospace;
            font-size: 12px;
            color: #8b949e;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(103, 232, 249, 0.2);
            border-top-color: #67e8f9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #root {
            min-height: 100vh;
        }

        #error-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #0D1117;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            padding: 32px;
            text-align: center;
            z-index: 99999;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-title {
            font-family: monospace;
            font-size: 18px;
            color: #f85149;
        }

        #error-message {
            font-family: monospace;
            font-size: 12px;
            color: #8b949e;
            max-width: 480px;
            white-space: pre-wrap;
            word-break: break-word;
            background: #161b22;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            text-align: left;
        }
    </style>
</head>

<body>

    <div id="splash">
        <div class="spinner"></div>
        <div id="splash-title">Reacture</div>
        <div id="splash-sub">Loading your portfolio...</div>
    </div>

    <div id="error-overlay">
        <div id="error-title">⚠️ Runtime Error</div>
        <pre id="error-message"></pre>
    </div>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    const ThemeContext = React.createContext("light");
const ProjectsContext = React.createContext([]);
const ProjectsDispatchContext = React.createContext(null)

function Badge(props) {
  return props.show ? <p>Available for work</p> : null;
}
function useTheme() {
  const [theme, setTheme] = React.useState("light");
  return [theme, setTheme];
}
function FilterBar(props) {
  return (
    <div>
      <button onClick={() => props.onSelect("All")}>All</button>
      <button onClick={() => props.onSelect("React")}>React</button>
    </div>
  );
}

function ProjectList(props) {
  const projects = React.useContext(ProjectsContext);
  const theme = React.useContext(ThemeContext);
  const visibleProjects =
    props.filter === "All"
      ? projects
      : projects.filter((project) => project.type === props.filter);

  return (
    <ul data-theme={theme}>
      {visibleProjects.map((project) => (
        <li key={project.id}>{project.name}</li>
      ))}
    </ul>
  );
}

function AddProjectButton() {
  const projects = React.useContext(ProjectsContext);
  const dispatch = React.useContext(ProjectsDispatchContext);

  return (
    <button
      onClick={() =>
        dispatch({
          type: "add",
          project: {
            id: projects.length + 1,
            name: "New Portfolio Project",
            type: "React"
          }
        })
      }
    >
      Add Project
    </button>
  );
}

function Editor(props) {
  const [text, setText] = React.useState("");

  return (
    <section>
      <h2>{props.label}</h2>
      <input value={text} onChange={(e) => setText(e.target.value)} />
    </section>
  );
}

function projectsReducer(state, action) {
  if (action.type === "add") {
    return [...state, action.project];
  }
  return state;
}

function Header(props) {
  return (
    <header>
      <h1>{props.profile.name}</h1>
      <p>{props.profile.title}</p>
      <p>Current section: {props.tab}</p>
      <p>Window width: {props.width}</p>
    </header>
  );
}

function Hero(props) {
  const [likes, setLikes] = React.useState(0);
  const visits = React.useRef(0);

  return (
    <section>
      <p>I build clean and responsive web interfaces.</p>
      <Badge show={true} />
      <button onClick={() => {
        setLikes((value) => value + 1);
        setLikes((value) => value + 1);
        setLikes((value) => value + 1);
      }}>
        +3 Likes: {likes}
      </button>
      <button
        onClick={() => {
          visits.current = visits.current + 1;
          console.log(visits.current);
        }}
      >
        Visit
      </button>
      <button
        onClick={() =>
          props.setProfile({
            ...props.profile,
            title: "React Developer"
          })
        }
      >
        Update Title
      </button>
    </section>
  );
}

function About(props) {
  return (
    <section>
      <h2>About</h2>
      <p>I build mini portfolio projects with React.</p>
      <button onClick={() => props.setSkills([...props.skills, "React"])}>
        Add Skill
      </button>
      <ul>
        {props.skills.map((skill) => (
          <li key={skill}>{skill}</li>
        ))}
      </ul>
    </section>
  );
}

function Projects(props) {
  return (
    <section>
      <h2>Projects</h2>
      <FilterBar onSelect={props.setFilter} />
      <AddProjectButton />
      <ProjectList filter={props.filter} />
    </section>
  );
}

function Contact() {
  const [open, setOpen] = React.useState(false);
  const [name, setName] = React.useState("");
  const [submitted, setSubmitted] = React.useState(false);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    document.title = submitted ? "Submitted" : "Contact Form";
  }, [submitted]);

  function handleSubmit(event) {
    event.preventDefault();
    setSubmitted(true);
    setOpen(true);
  }

  return (
    <section>
      <h2>Contact</h2>
      <form onSubmit={handleSubmit}>
        <input
          ref={inputRef}
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="Enter your name"
        />
        <button type="button" onClick={() => inputRef.current.focus()}>
          Focus Input
        </button>
        <button type="button" onClick={() => setOpen(!open)}>
          Toggle Contact
        </button>
        <button type="submit">Send</button>
      </form>
      <p>{name || "Your name here"}</p>
      {open && <p>alex@example.com</p>}
    </section>
  );
}

            </nav>
            <Hero profile={profile} setProfile={setProfile} />

            {tab === "About" ? (

            <footer>{year}</footer>

        </ProjectsDispatchContext.Provider>

  );

    <script>
        (function () {
            function hideSplash() {
                var root = document.getElementById('root');
                var splash = document.getElementById('splash');
                if (root && root.children.length > 0) {
                    splash.classList.add('hidden');
                    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
                } else {
                    setTimeout(hideSplash, 100);
                }
            }

            window.addEventListener('error', function (event) {
                document.getElementById('splash').classList.add('hidden');
                var overlay = document.getElementById('error-overlay');
                overlay.classList.add('visible');
                document.getElementById('error-message').textContent =
                    (event.error && event.error.message) || String(event.message || event);
            });

            window.addEventListener('load', function () { setTimeout(hideSplash, 300); });
        })();
